services:
  frontend:
    image: sayasn/devops-course-frontend
    ports:
      - "5001:5001"
  backend:
    image: sayasn/devops-course-backend
    ports:
      - "8080:8080"
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis
    restart: unless-stopped
  redis:
    image: redis
