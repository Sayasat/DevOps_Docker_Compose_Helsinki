services:
  frontend:
    image: sayasn/devops-course-frontend

  backend:
    image: sayasn/devops-course-backend
    environment:
      - REDIS_HOST=redis
      - POSTGRES_HOST=db
      - REQUEST_ORIGIN=http://localhost:8000
    depends_on:
      - redis
      - db
    restart: unless-stopped

  redis:
    image: redis

  db:
    image: postgres:18
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DATABASE=postgres
    restart: unless-stopped
    volumes:
      - ./database:/var/lib/postgresql

  nginx:
    image: nginx
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend
      - backend



